name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests, types and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Unit and regression tests
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build

  browser:
    name: Browser flows at mobile and desktop sizes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:3102
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-fixture-public-key
      CHECK_START_SERVER: '1'
      CHECK_REGRESSIONS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chrome and browser dependencies
        run: npx playwright install --with-deps chrome
      - name: Build with simulated account configuration
        run: npm run build
      - name: Journal, offline, backups, planning and authentication
        run: timeout 10m npm run check:mountain
      - name: Keep browser reports and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-results
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
          path: |
            .npm-cache/mountain-check/
            .npm-cache/planning-check/
            .npm-cache/auth-check/
            .next/product-check/
